version: "3.9"

services:
  backend:
    build: .
    image: my_project_backend
    container_name: backend
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  db:
    image: postgres:16
    container_name: db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  celery:
    image: my_project_backend
    container_name: celery
    depends_on:
      - backend
      - db
      - redis
    env_file:
      - .env
    command: celery -A config worker -l info
    volumes:
      - .:/app

  celery_beat:
    image: my_project_backend
    container_name: celery_beat
    depends_on:
      - backend
      - db
      - redis
    env_file:
      - .env
    command: celery -A config beat -l info
    volumes:
      - .:/app

volumes:
  postgres_data:
